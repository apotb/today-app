# Render Blueprint: Express API only.
# After deploy: Dashboard → your service → Environment → add TICKETMASTER_API_KEY,
# EVENTBRITE_API_TOKEN, GOOGLE_PLACES_API_KEY (optional; app starts without them).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: today-app-api
    runtime: node
    plan: free
    # Skip devDependencies. Rebuild sqlite3 on Render's Linux so the native addon matches their
    # glibc (prebuilt binaries may require GLIBC_2.38 and crash at runtime).
    buildCommand: npm ci --omit=dev && npm rebuild sqlite3 --build-from-source
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
