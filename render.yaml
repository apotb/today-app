# Render Blueprint: Express API only.
# After deploy: Dashboard → your service → Environment → add TICKETMASTER_API_KEY,
# EVENTBRITE_API_TOKEN, GOOGLE_PLACES_API_KEY (optional; app starts without them).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: today-app-api
    runtime: node
    plan: free
    # Skip devDependencies (Vite/React/TS) so the build stays small—free tier often OOMs on full npm ci.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
