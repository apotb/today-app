# Render Blueprint: Express API only.
# After deploy: Dashboard → your service → Environment → add TICKETMASTER_API_KEY,
# EVENTBRITE_API_TOKEN, GOOGLE_PLACES_API_KEY (optional; app starts without them).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: today-app-api
    runtime: node
    plan: free
    # Skip devDependencies. DB uses Node built-in node:sqlite (no native sqlite3 addon).
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
